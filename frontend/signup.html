<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — NXC LEVEL UP</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-box"><i class="fa-solid fa-bolt"></i></div>
            <h1>NXC <span>LEVEL UP</span></h1>
            <p>Create your free account</p>
        </div>
        <form id="signup-form" class="auth-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="form-input" placeholder="your name" required minlength="2">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-input" placeholder="min 6 chars" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-full"><i class="fa-solid fa-user-plus"></i> Create Account</button>
        </form>
        <div class="auth-footer">
            Already have an account? <a href="/login">Login</a>
        </div>
        <div id="err" class="auth-error"></div>
    </div>
</div>
<script src="/static/app.js"></script>
<script>
document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('err');
    err.style.display = 'none';
    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    try {
        const res = await fetch('/api/auth/signup', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || data.error || 'Signup failed');
        localStorage.setItem('nxc_token', data.access_token);
        localStorage.setItem('nxc_user', JSON.stringify(data.user));
        location.href = '/dashboard';
    } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
    }
});
</script>
</body>
</html>
